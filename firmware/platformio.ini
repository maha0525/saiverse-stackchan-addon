; PlatformIO Project Configuration
;
; SAIVerse Stack-chan Vessel Firmware
; Target: M5Stack CoreS3 (ESP32-S3) — StackChan AI Desktop Robot 同梱基板
;
; Build:
;   pio run                 # ビルドのみ (artifact: .pio/build/m5stack-cores3/firmware.bin)
;   pio run -t upload       # USB 経由で書き込み
;   pio device monitor      # シリアルモニタ
;
; Phase 1 機能:
;   - 初回起動: WiFiManager AP モードで設定 UI (Wi-Fi + SAIVerse URL + vessel_id + token)
;   - 通常起動: WebSocket で SAIVerse に接続、hello → welcome → ping/pong / echo
;   - ボタン A 長押し (3 秒): 設定リセット (再ペアリング)
;   - ボタン B: 動作確認用 echo 送信

[env:m5stack-cores3]
platform = espressif32@^6.7.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

board_build.partitions = default_8MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

lib_deps =
    m5stack/M5Unified@^0.2.6
    bblanchon/ArduinoJson@^7.4.1
    links2004/WebSockets@^2.4.1
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    ; Phase 2: MP3 デコード (voice-tts の audio_stream が MP3 progressive
    ; で出してくるのを ESP32-S3 上でデコードして M5.Speaker へ流すため)。
    ; pschatzmann/arduino-libhelix は PlatformIO Registry に未登録なため、
    ; GitHub から直接取得する。
    https://github.com/pschatzmann/arduino-libhelix.git

; Web Serial フラッシュ用バイナリ単体出力:
;   pio run の後 .pio/build/m5stack-cores3/firmware.bin を ../dist/ にコピーして配布
